name = "wara-monku-ai"
main = "worker/index.mjs"
compatibility_date = "2026-11-04"
workers_dev = false
preview_urls = false
# The exact host route takes precedence over the zone's shared *.monku.ai/* route.
routes = [
  { pattern = "wara.monku.ai", custom_domain = true },
  { pattern = "wara.monku.ai/*", zone_name = "monku.ai" }
]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "wara-monku-auth"
database_id = "9a3bf1f1-f58f-4098-bd54-7a555dfb1f08"
migrations_dir = "migrations"

[vars]
# Enable explicitly for a Devnet trial. SMS delivery is simulated.
AUTH_MODE = "disabled"
